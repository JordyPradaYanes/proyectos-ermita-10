<div class="module-header">
  <h2><i class="fa-solid fa-wave-square"></i> Simulador de Ondas</h2>
  <p class="module-desc">Ajusta la frecuencia y amplitud para visualizar distintos tipos de onda en tiempo real.</p>
</div>

<div class="wave-container">
  <canvas class="wave-canvas" id="waveCanvas" width="800" height="300" aria-label="Visualización de onda"></canvas>

  <div class="wave-controls">
    <div class="control-group">
      <label for="sliderFreq">
        <i class="fa-solid fa-arrows-left-right"></i>
        Frecuencia: <span id="valFreq" class="mono">1.0</span> Hz
      </label>
      <input type="range" id="sliderFreq" min="0.1" max="5" step="0.1" value="1" class="slider" />
    </div>
    <div class="control-group">
      <label for="sliderAmp">
        <i class="fa-solid fa-arrows-up-down"></i>
        Amplitud: <span id="valAmp" class="mono">80</span> px
      </label>
      <input type="range" id="sliderAmp" min="10" max="130" step="5" value="80" class="slider" />
    </div>
    <div class="control-group">
      <label for="sliderSpeed">
        <i class="fa-solid fa-gauge-high"></i>
        Velocidad: <span id="valSpeed" class="mono">1.0</span>x
      </label>
      <input type="range" id="sliderSpeed" min="0.1" max="3" step="0.1" value="1" class="slider" />
    </div>
    <div class="wave-type-btns">
      <button class="wave-type-btn active" data-wave="sin">Senoidal</button>
      <button class="wave-type-btn" data-wave="square">Cuadrada</button>
      <button class="wave-type-btn" data-wave="triangle">Triangular</button>
    </div>
  </div>

  <div class="wave-info">
    <div class="info-card">
      <span class="info-label"><i class="fa-solid fa-ruler-horizontal"></i> Longitud de onda</span>
      <span class="info-val mono" id="waveLength">—</span>
    </div>
    <div class="info-card">
      <span class="info-label"><i class="fa-solid fa-clock"></i> Período</span>
      <span class="info-val mono" id="wavePeriod">—</span>
    </div>
    <div class="info-card">
      <span class="info-label"><i class="fa-solid fa-shapes"></i> Tipo</span>
      <span class="info-val" id="waveTypeLabel">Senoidal</span>
    </div>
  </div>
</div>
