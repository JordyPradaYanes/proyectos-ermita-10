<div class="module-header">
  <h2><i class="fa-solid fa-earth-americas"></i> Laboratorio de Gravedad</h2>
  <p class="module-desc">Observa cómo cae un objeto simulado en diferentes entornos de gravedad (Tierra, Luna, Júpiter).</p>
</div>

<div class="gravity-container">
  <div class="gravity-panel">
    <canvas id="gravityCanvas" width="400" height="500"></canvas>
  </div>
  
  <div class="gravity-controls">
    <div class="hud-card" style="margin-bottom:1.5rem">
      <span class="hud-label">Altura (m)</span>
      <span class="hud-val mono" id="gravHeightLabel">10.0</span>
    </div>

    <div class="input-group">
      <label>Entorno Gravitatorio</label>
      <div class="env-btns">
        <button class="btn-secondary active-mode" data-g="9.8" id="gravEarth"><i class="fa-solid fa-earth-americas"></i> Tierra (9.8 m/s²)</button>
        <button class="btn-secondary" data-g="1.62" id="gravMoon"><i class="fa-solid fa-moon"></i> Luna (1.6 m/s²)</button>
        <button class="btn-secondary" data-g="24.79" id="gravJupiter"><i class="fa-solid fa-meteor"></i> Júpiter (24.8 m/s²)</button>
      </div>
    </div>

    <button class="btn-primary" id="gravDropBtn" style="width:100%; justify-content:center; margin-top:1rem; padding:1rem; font-size:1.1rem;">
      <i class="fa-solid fa-arrow-down"></i> Soltar Objeto
    </button>

    <div class="gravity-stats" id="gravStats" hidden style="margin-top:2rem; padding-top:2rem; border-top:1px solid var(--clr-border);">
      <h3 style="font-size:1.2rem; margin-bottom:1rem; color:var(--clr-accent);">Resultados</h3>
      <p>Tiempo de caída: <strong id="gravTime" class="mono" style="font-size:1.2rem;">0.00</strong> s</p>
      <p>Velocidad final: <strong id="gravVel" class="mono" style="font-size:1.2rem;">0.00</strong> m/s</p>
    </div>
  </div>
</div>
